[package]
name = "fake_j2534"
version = "0.1.0"
edition = "2021"
publish = false

# Минимальная подделка J2534-драйвера для E2E-регрессии «логируется только
# первый шаг». Экспорт PassThruOpen/PassThruClose без устройства: тест грузит
# DLL, вызывает Open, выгружает и грузит заново (как PCMflash между своими
# действиями). Собирается только для ручного `#[ignore]`-теста.
[lib]
crate-type = ["cdylib"]
